<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroFoundary Payment</title>

<link rel="stylesheet" href="styles.css">

<style>
    body {
        background: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
    }

    /* Brand-standard header: left aligned, logo over title */
    .header {
        display: block;
        text-align: left;
        padding: 20px;
    }

    .header img {
        width: 120px;
        height: auto;
        display: block;
        margin-bottom: 6px;
    }

    .header-title {
        font-size: 28px;
        font-weight: 600;
        color: #222;
        margin: 0;
    }

    .content-box {
        margin: 30px auto;
        width: 90%;
        max-width: 420px;
        padding: 20px;
        border-radius: 12px;
        background: #fafafa;
        box-shadow: 0 0 8px rgba(0,0,0,0.08);
        text-align: center;
    }

    .label {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .price {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 20px;
    }

    #payment-placeholder {
        margin-top: 20px;
        font-size: 16px;
        color: #555;
    }
</style>

</head>
<body>

<!-- Brand-standard header -->
<div class="header">
    <img src="IMG_1741.jpeg" alt="MicroFoundary Logo">
    <div class="header-title">MicroFoundary</div>
</div>

<!-- Main Content -->
<div class="content-box">
    <div id="toolName" class="label"></div>
    <div id="toolPrice" class="price"></div>

    <!-- Processor-only stub -->
    <div id="payment-placeholder">
        Payment processor stub — awaiting PayPal credit card integration.
    </div>
</div>

<script>
    // Read tool name from URL
    const params = new URLSearchParams(window.location.search);
    const tool = params.get("tool");

    // Whole-dollar price table
    const prices = {
        "Clarifier": 5,
        "PulseCounter": 4,
        "AutoWriter": 6,
        "MicroNote": 3,
        "TimeStampTool": 3,
        "StarterWidget": 2,
        "QuickCounter": 3,
        "MicroTimer": 3,
        "MicroCopy": 2
    };

    // Tool + price for processor
    document.getElementById("toolName").innerText = `Tool: ${tool}`;
    const price = prices[tool] || 0;
    document.getElementById("toolPrice").innerText = `Price: $${price}.00`;
</script>

</body>
</html>
